<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游泉秘密管理後台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=LXGW+WenKai+TC:wght@300;400;700&family=Liu+Jian+Mao+Cao&family=Long+Cang&family=Noto+Serif+TC:wght@400;600;700;900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260929_042800">
    <style>
        body {
            background-color: var(--bg-color, #F4F1ED);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        /* Make sure modals show nicely */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
            /* Usually modals are fixed and overlay everything, but here it's the main UI */
        }
    </style>
</head>
<body>

    <!-- 預覽專用的隱藏房間畫面 (與前端 index.html 相同) -->
    <main class="main-container" style="display:none;" id="preview-main-container">
        <section id="secret-pan-screen" class="screen secret-pan-screen hidden" style="min-height: 100vh;">
            <div class="secret-header">
                <h2>歡迎回到我們的秘密基地：）</h2>
            </div>
            <div id="polaroid-wall" class="polaroid-wall"></div>
            <div class="secret-actions" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button id="secret-back-button" class="secondary-button" type="button" onclick="document.getElementById('preview-main-container').style.display='none'; openYouquanAdminModal();">返回後台</button>
            </div>
        </section>
    </main>

    <!-- 玩家收信與回信 Modal (供預覽使用) -->
    <div id="player-letter-modal" class="modal-overlay hidden" style="z-index: 10000;">
        <div class="modal-card letter-card" style="max-width: 500px; background: #fffdf8;">
            <h3 style="margin-bottom: 15px; color: #5a3d2b;">✉️ 來自游泉的信</h3>
            <div id="player-letter-content" style="font-size: 15px; color: #333; margin-bottom: 20px; line-height: 1.6; white-space: pre-wrap; text-align: left; background: #f4eee1; padding: 15px; border-radius: 8px;"></div>
            
            <h4 style="margin-bottom: 8px; color: #5a3d2b; text-align: left; font-size: 14px;">✍️ 寫回信給游泉：</h4>
            <textarea id="player-letter-reply" class="modal-textarea" rows="4" placeholder="在這裡寫下給游泉的回信..."></textarea>
            
            <div class="modal-buttons" style="margin-top: 15px;">
                <button id="player-letter-submit" class="primary-button" type="button" style="background: var(--gold); border-color: var(--gold); color: #fff;">送出回信</button>
                <button id="player-letter-close" class="secondary-button" type="button">關閉</button>
            </div>
        </div>
    </div>

    <!-- 游泉秘密管理後台 Modal -->
    <div id="youquan-admin-modal" class="modal-overlay hidden">
        <div class="modal-card admin-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin: 0;">游泉秘密管理後台</h3>
            </div>
            <div class="admin-form">
                <label class="form-label">玩家專屬密語 / 房號：</label>
                <input id="admin-key-input" type="text" class="modal-input" placeholder="例如：0731 或 room1" />

                <label class="form-label">上傳 / 選擇照片（可多選）：</label>
                <input id="admin-photo-file" type="file" accept="image/*" multiple class="modal-file-input" />
                <input id="admin-photo-url" type="text" class="modal-input" placeholder="或貼上單張圖片網址 (Image URL)..." style="font-size:13px;" />

                <!-- 每張照片配獨立留言，由 JS 動態生成 -->
                <div id="admin-photo-preview" class="admin-photo-preview"></div>

                <!-- URL 模式的單則留言 -->
                <label class="form-label" id="admin-url-msg-label" style="display:none;">留言：</label>
                <textarea id="admin-message-input" class="modal-textarea" rows="2" placeholder="撰寫給畔的悄悄話..." style="display:none;"></textarea>

                <!-- 寫信功能 -->
                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--line);">
                    <label class="form-label" style="color: var(--gold);">✉️ 撰寫專屬信件給畔（選填）：</label>
                    <textarea id="admin-letter-input" class="modal-textarea" rows="3" placeholder="寫一封信... 玩家點擊信封後可以回信給您"></textarea>
                </div>

                <div class="modal-buttons" style="margin-top: 10px; gap: 8px;">
                    <button id="admin-save-button" class="primary-button" type="button" style="flex: 2;">💾 儲存所有內容</button>
                </div>
            </div>

            <!-- 高級工具列（折疊或次要） -->
            <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted);">
                <span>☁️ 雲端自動同步中</span>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="btn-sm" onclick="recoverAllHistoryPhotos()" style="font-size:11px; padding:2px 6px;">🚑 救援照片</button>

                    <button id="admin-toggle-dm-gender" class="btn-sm" type="button" style="font-size:11px; padding:2px 6px;">切換為 男 GM 模式</button>
                    <button id="admin-lock-button" class="btn-sm btn-sm-danger" type="button" style="font-size:11px; padding:2px 6px;">🔒 鎖定</button>
                </div>
            </div>

            <div style="margin-top: 10px; margin-bottom: 8px;">
                <input id="admin-search-input" type="text" class="modal-input" placeholder="🔍 搜尋房號 / 密語 / 關鍵字..." style="font-size: 13px; padding: 6px 10px; margin: 0;" />
            </div>

            <div id="admin-saved-list" class="admin-saved-list"></div>
        </div>
    </div>

    <!-- 照片放大瀏覽 Modal -->
    <div id="photo-lightbox-modal" class="modal-overlay hidden" style="z-index: 10000; cursor: pointer;">
        <div class="lightbox-card" onclick="event.stopPropagation()">
            <button id="lightbox-close" class="lightbox-close-btn" type="button" aria-label="關閉">&times;</button>
            <div class="lightbox-img-wrap">
                <img id="lightbox-img" src="" alt="放大相片" />
            </div>
            <div id="lightbox-note" class="polaroid-note lightbox-note"></div>
        </div>
    </div>

    <script src="script.js?v=20260929_042800"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 直接開啟後台，不需要密碼驗證
            setTimeout(() => {
                openYouquanAdminModal();
            }, 100);
        });

        // 重新綁定關閉按鈕事件為重新驗證或是保留狀態
        document.addEventListener('click', function(e) {
            // Remove the cancel button logic since this is a dedicated page
        });
    </script>
</body>
</html>
